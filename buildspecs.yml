version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.24
    commands:
      - echo "Installing dependencies..."
      - go version
      - go mod download

  pre_build:
    commands:
      - echo "Running tests..."
      - go test ./...

  build:
    commands:
      - echo "Building application..."
      - mkdir -p build
      - go build -o build/app .
      - echo "Build completed successfully"

artifacts:
  files:
    - build/**/*
