version: 0.2

env:
  variables:
    DATABASE_URL: "postgres://user:password@localhost:5432/mydb"
  parameter-store:
    DATABASE_URL: "/codebuild/database-url"

phases:
  install:
    runtime-versions:
      golang: 1.24
    commands:
      - echo "Installing dependencies..."
      - go version
      - go mod download

  pre_build:
    commands:
      - echo "Running tests..."
      - go test ./...

  build:
    commands:
      - echo "Building application..."

      # Build the application from the root package
      - mkdir -p build
      - go build -o build/app .
      - echo "Build completed successfully"

artifacts:
  files:
    - build/**/*
