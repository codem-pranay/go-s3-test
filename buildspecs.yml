version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.24
    commands:
      - echo "Installing dependencies..."
      - go version
      - go mod download

  pre_build:
    commands:
      - echo "Running tests..."
      - go test ./...

  build:
    commands:
      - echo "Building application..."

      # Mistake 1: Build a package that doesn't exist
      - go build -o build/app ./invalid-package

      # Mistake 2: Try to copy a file that doesn't exist
      - cp config/production.yaml build/

      # Mistake 3: Execute a non-existent command
      - deploy-go-app

artifacts:
  files:
    - build/**/*
